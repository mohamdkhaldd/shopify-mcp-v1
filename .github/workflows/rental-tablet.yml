name: Rental - Tablet (Android)

# البنيان - التأجير على التابلت: نفس البرنامج ملفوف كتطبيق APK
# (com.albunyan.rental — مختلف عن تطبيق الحسابات القديم فبيتسطبوا جنب بعض).
# بيتبني لوحده مع كل تعديل في rental-app. لو RELEASES_TOKEN موجود، بيتنشر
# في ريبو albunyan-rental-releases العام باسم tablet-vX — التابلت بيلاقيه
# هناك ويعرض التحديث. من غير التوكن، الـ APK بيبقى في Artifacts بس.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the releases repo (customers get it as an update)"
        type: boolean
        default: false
      preview:
        description: "Put a trial web version at /preview/ (the live web version and apps stay as they are)"
        type: boolean
        default: false
  push:
    branches: [claude/albunyan-rental-app]
    paths: ["rental-app/**", ".github/workflows/rental-tablet.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: rental-app
    env:
      HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' && (github.event_name == 'push' || inputs.publish) }}
      HAS_PREVIEW: ${{ secrets.RELEASES_TOKEN != '' && inputs.preview }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - name: Tests on the tablet's database engine
        run: npm run test:tablet

      - name: Set version
        run: echo "APP_VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build tablet web app
        run: npm run build:tablet

      # the same build is the web version (iPhone / any browser): published to
      # GitHub Pages of the public releases repo, opened from
      # https://mohamdkhaldd.github.io/albunyan-rental-releases/
      - name: Publish the web version
        if: env.HAS_RELEASES_TOKEN == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.RELEASES_TOKEN }}
          external_repository: mohamdkhaldd/albunyan-rental-releases
          publish_branch: gh-pages
          publish_dir: rental-app/dist-tablet
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "web version ${{ env.APP_VERSION }}"

      # a trial copy at https://mohamdkhaldd.github.io/albunyan-rental-releases/preview/
      # with its own browser storage; the next real publish removes it
      - name: Build the preview web version
        if: env.HAS_PREVIEW == 'true'
        run: PREVIEW=1 npx vite build --config vite.tablet.config.ts
      - name: Publish the preview web version
        if: env.HAS_PREVIEW == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.RELEASES_TOKEN }}
          external_repository: mohamdkhaldd/albunyan-rental-releases
          publish_branch: gh-pages
          publish_dir: rental-app/dist-preview
          destination_dir: preview
          keep_files: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "preview web version ${{ env.APP_VERSION }}"

      - name: Create Android project
        run: npx cap add android

      - name: Customize Android project
        timeout-minutes: 5
        run: |
          JAVA_DIR=android/app/src/main/java/com/albunyan/rental
          cp tablet/android/PrinterPlugin.java tablet/android/MainActivity.java tablet/android/UpdaterPlugin.java "$JAVA_DIR/"
          # in-app updates need permission to install packages
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />#' android/app/src/main/AndroidManifest.xml
          grep -q REQUEST_INSTALL_PACKAGES android/app/src/main/AndroidManifest.xml
          cp tablet/android/release.keystore android/app/
          cat tablet/android/signing.gradle >> android/app/build.gradle
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"$APP_VERSION\"/" android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle
          # app icon = company logo (pre-made in tablet/android/res)
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r tablet/android/res/. android/app/src/main/res/
          npx cap sync android

      - name: Build signed APK
        working-directory: rental-app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "mk-tech-rental-tablet-$APP_VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: mk-tech-rental-tablet-apk
          path: rental-app/mk-tech-rental-tablet-*.apk

      # prerelease: the laptop's updater skips it, the tablet looks for tablet-v*
      - uses: softprops/action-gh-release@v2
        if: env.HAS_RELEASES_TOKEN == 'true'
        with:
          repository: mohamdkhaldd/albunyan-rental-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: tablet-v${{ env.APP_VERSION }}
          name: نسخة التابلت ${{ env.APP_VERSION }}
          prerelease: true
          files: rental-app/mk-tech-rental-tablet-${{ env.APP_VERSION }}.apk

      # one fixed link that always downloads the newest APK:
      # https://github.com/mohamdkhaldd/albunyan-rental-releases/releases/download/tablet-latest/mk-tech-rental-tablet.apk
      - name: Fixed-name copy for the download link
        if: env.HAS_RELEASES_TOKEN == 'true'
        run: cp "mk-tech-rental-tablet-$APP_VERSION.apk" mk-tech-rental-tablet.apk
      - uses: softprops/action-gh-release@v2
        if: env.HAS_RELEASES_TOKEN == 'true'
        with:
          repository: mohamdkhaldd/albunyan-rental-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: tablet-latest
          name: التابلت — آخر نسخة
          prerelease: true
          files: rental-app/mk-tech-rental-tablet.apk
