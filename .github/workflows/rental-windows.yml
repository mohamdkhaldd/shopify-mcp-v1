name: Rental - Windows installer

# برنامج البنيان - التأجير على الويندوز. بيتبني لوحده مع كل تعديل في
# rental-app. لو RELEASES_TOKEN موجود، بيتنشر في ريبو albunyan-rental-releases
# العام (ملفات تسطيب بس، من غير كود) — البرنامج المتسطب بيراجع الريبو ده
# لوحده وبينزّل التحديث في الخلفية. من غير التوكن، الملف بيبقى في Artifacts بس.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the releases repo (customers get it as an update)"
        type: boolean
        default: false
  push:
    branches: [claude/albunyan-rental-app]
    paths: ["rental-app/**", ".github/workflows/rental-windows.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: rental-app
    env:
      HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' && (github.event_name == 'push' || inputs.publish) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm test

      # every build gets a higher number so installed copies see it as an update
      - run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version

      - name: Build and publish
        if: env.HAS_RELEASES_TOKEN == 'true'
        run: npm run electron:build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}

      - name: Build only (no RELEASES_TOKEN yet)
        if: env.HAS_RELEASES_TOKEN != 'true'
        run: npm run electron:build -- --publish never

      # the same installer under a fixed name, so one link always downloads the latest:
      # https://github.com/mohamdkhaldd/albunyan-rental-releases/releases/latest/download/mk-tech-rental-setup.exe
      - name: Fixed-name copy for the download link
        if: env.HAS_RELEASES_TOKEN == 'true'
        shell: bash
        run: cp release/mk-tech-rental-setup-0.1.${{ github.run_number }}.exe release/mk-tech-rental-setup.exe
      - uses: softprops/action-gh-release@v2
        if: env.HAS_RELEASES_TOKEN == 'true'
        with:
          repository: mohamdkhaldd/albunyan-rental-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v0.1.${{ github.run_number }}
          files: rental-app/release/mk-tech-rental-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: albunyan-rental-windows-installer
          path: rental-app/release/*.exe
