<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 240">
  <defs>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#0B5FFF"/>
    </linearGradient>
    <linearGradient id="vee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#0B3FB8"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0B5FFF"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>
  <!-- M: the V between its two legs (drawn first, the legs sit on it) -->
  <polygon points="0,0 56,0 116,112 176,0 232,0 116,212" fill="url(#vee)"/>
  <!-- M: left leg -->
  <rect x="0" y="0" width="52" height="240" fill="url(#stem)"/>
  <!-- M's right leg is also the K's stem -->
  <rect x="180" y="0" width="52" height="240" fill="url(#stem)"/>
  <!-- K: upper arm -->
  <polygon points="232,118 330,0 400,0 232,200" fill="url(#arm)"/>
  <!-- K: lower arm -->
  <polygon points="268,158 306,114 410,240 338,240" fill="url(#stem)"/>
</svg>
